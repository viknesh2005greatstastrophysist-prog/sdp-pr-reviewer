services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://reviewer:reviewer@postgres:5432/reviewer
      # The root filesystem is read-only; analyzers need a writable home for caches.
      HOME: /tmp
      SEMGREP_SEND_METRICS: "off"
      RUFF_CACHE_DIR: /tmp/ruff-cache
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reviewer
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: reviewer
    volumes:
      - reviewer-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reviewer-data:
