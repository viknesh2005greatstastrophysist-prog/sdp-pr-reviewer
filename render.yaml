# Render Blueprint: one free Docker web service plus one free Postgres database.
# Secrets marked sync: false are entered once in the Render dashboard, never committed.
services:
  - type: web
    name: sdp-pr-reviewer
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sdp-pr-reviewer-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: DEMO_ACCOUNTS
        sync: false
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: PUBLISH_REVIEWS
        value: "false"
      - key: REVIEW_CONCURRENCY
        value: "2"
      - key: HOME
        value: /tmp
      - key: SEMGREP_SEND_METRICS
        value: "off"

databases:
  - name: sdp-pr-reviewer-db
    plan: free
