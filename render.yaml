# Render Blueprint: one free Docker web service plus one free Postgres database.
# Secrets marked sync: false are entered once in the Render dashboard, never committed.
services:
  - type: web
    name: sdp-pr-reviewer
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sdp-pr-reviewer-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      # PBKDF2 hashes only (600k iterations); plain passwords are never committed.
      - key: DEMO_ACCOUNTS
        value: "guide:pbkdf2_sha256$600000$7+kwGUSFIGVy/Lbwb1SKrA==$G+/UvnPMdWFSyfOkHJO2OGZqXQBL1DtvpTp+e6Ibi9s=,team61:pbkdf2_sha256$600000$QR7LkxCR1K9nrRXTkZ34Zw==$yDUp6qyj90htJ4S7ZNqe2/dCpBrkbko5Z1JaNBwoAYE=,evaluator:pbkdf2_sha256$600000$RqEKKR6SEUlGMaeACrMEWw==$wUOA0faWnjy0Ut8UuJTsTT2L/vWmAQiIJ3WQ19glhiw="
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: PUBLISH_REVIEWS
        value: "false"
      - key: REVIEW_CONCURRENCY
        value: "2"
      - key: HOME
        value: /tmp
      - key: SEMGREP_SEND_METRICS
        value: "off"

databases:
  - name: sdp-pr-reviewer-db
    plan: free
