[project]
name = "sdp-pr-reviewer"
version = "1.0.0"
description = "Evidence-grounded multi-agent pull request reviewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "pydantic>=2,<3",
  "PyJWT[crypto]>=2.8,<3",
  "cryptography>=42",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
analysis = [
  "ruff>=0.5,<1",
  "semgrep>=1.80,<2; sys_platform != 'win32'",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "semgrep>=1.80,<2; sys_platform != 'win32'",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
pr-reviewer = "pr_reviewer.cli:main"
pr-reviewer-evaluate = "pr_reviewer.evaluation:main"
pr-reviewer-hash-password = "pr_reviewer.cli_auth:main"
pr-reviewer-build-corpus = "pr_reviewer.corpus:main"
pr-reviewer-label-corpus = "pr_reviewer.labeling:main"
pr-reviewer-score = "pr_reviewer.scoring:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pr_reviewer = ["semgrep_rules.yml", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
