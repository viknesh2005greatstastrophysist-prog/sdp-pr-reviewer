name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,postgres]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q --cov=pr_reviewer --cov-report=term-missing
      - run: semgrep scan --config src/pr_reviewer/semgrep_rules.yml src tests
